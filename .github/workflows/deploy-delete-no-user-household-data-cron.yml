name: Deploy delete-no-user-household-data-cron

on:
  push:
    branches:
      - main
    paths:
      - 'apps/delete-no-user-household-data-cron/**'
      - 'packages/**'
      - pnpm-lock.yaml
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy delete-no-user-household-data-cron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter delete-no-user-household-data-cron deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
